<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shield Story · Data Receipt</title>
<link rel="stylesheet" href="/static/css/app.css">
<style>
  .wsw{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:-2px;margin-right:6px}
  .wrow{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:center;margin:14px 0}
  .wlab b{display:block;font-size:22px} .wlab span{color:var(--mute);font-size:15px}
  .wtrack{min-width:0}
  .wbar{display:flex;height:64px;border-radius:10px;overflow:hidden;min-width:60px}
  .wseg{display:flex;align-items:center;justify-content:center;min-width:48px;border-right:2px solid var(--ink)}
  .wseg:last-child{border-right:0}
  .wseg b{font-family:var(--mono);font-size:30px;color:#0e0f12}
  .wchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:-4px}
  .wchip{font-family:var(--mono);font-size:14px;font-weight:700;color:#ffb020;border:1px solid #6b4a0a;background:#2a1f08;border-radius:999px;padding:3px 10px}
  .wcap{font-size:20px;margin-top:18px}
  @media (max-width:700px){.wrow{grid-template-columns:1fr;gap:6px}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">DATA&nbsp;RECEIPT<small>on-device tracker detection · no cloud</small></a>
  <nav class="tabs"><a href="/">Live receipt</a><a href="/story" class="active">Shield story</a></nav>
  <div class="topbar-right">
    <span class="conn" id="conn"><i></i><span>Connecting…</span></span>
  </div>
</header>

<div class="sessionbar">
  <label class="field"><span>App</span><select id="app" title="App for the before / after"></select></label>
  <label class="field" hidden><span>Timeline session</span><select id="session" title="Session for the timeline"></select></label>
</div>

<main class="story">
  <section>
    <h2 id="ba-title">Shield before / after</h2>
    <div class="ba" id="ba"><div class="empty">Loading…</div></div>
  </section>
  <section class="panel">
    <h2 id="tl-title">Where the trackers went</h2>
    <div class="legend">
      <span><i class="wsw" style="background:#ff4d3d"></i>reached the phone</span>
      <span><i class="wsw" style="background:#33d17a"></i>blocked by Shield</span>
      <span><i class="wsw" style="background:#ffb020"></i>caught by our detector</span>
      <span><i class="wsw" style="background:#6b7080"></i>got through</span>
    </div>
    <div id="tl"><div class="empty">Loading…</div></div>
  </section>
</main>
<script type="module" src="/static/js/story.js"></script>
</body>
</html>
