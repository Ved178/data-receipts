<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shield Story · Data Receipt</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">DATA&nbsp;RECEIPT<small>on-device tracker detection · no cloud</small></a>
  <nav class="tabs"><a href="/">Live receipt</a><a href="/story" class="active">Shield story</a></nav>
  <div class="topbar-right">
    <span class="conn" id="conn"><i></i><span>Connecting…</span></span>
  </div>
</header>

<div class="sessionbar">
  <label class="field"><span>App</span><select id="app" title="App for the before / after"></select></label>
  <label class="field"><span>Timeline session</span><select id="session" title="Session for the timeline"></select></label>
</div>

<main class="story">
  <section>
    <h2 id="ba-title">Shield before / after</h2>
    <div class="ba" id="ba"><div class="empty">Loading…</div></div>
  </section>
  <section class="panel">
    <h2 id="tl-title">Whack-a-mole · block one ad company, the app reaches for another</h2>
    <div class="legend">
      <span><svg width="20" height="20"><path d="M5 5L15 15M15 5L5 15" stroke="#ff4d3d" stroke-width="3.5" stroke-linecap="round"/></svg>blocked by Shield</span>
      <span><svg width="20" height="20"><circle cx="10" cy="10" r="7" fill="#ffb020"/></svg>caught by our detector</span>
      <span><svg width="20" height="20"><circle cx="10" cy="10" r="5" fill="#6b7080"/></svg>allowed through</span>
      <span><svg width="20" height="20"><path d="M10 0V20" stroke="#ffb020" stroke-width="3" stroke-dasharray="5 4"/></svg>game switched networks</span>
    </div>
    <div id="tl"><div class="empty">Loading…</div></div>
  </section>
</main>
<script type="module" src="/static/js/story.js"></script>
</body>
</html>
